name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite (regression | smoke | api)"
        default: "regression"
      demo_failure:
        description: "Run only an intentionally failing test, to demo the failure triage job"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *" # daily 09:00 IST, full regression

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: PII check + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: bash scripts/pii-check.sh
      - run: mvn -B -q test-compile

  e2e:
    name: E2E ${{ matrix.browser }}
    # Firefox/WebKit run against a public demo site that sheds load (503 "queue full"); they report but do not gate.
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    needs: checks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/java:v1.49.0-noble   # browsers preinstalled, no install step
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      HOME: /root   # Firefox refuses to start when $HOME is not owned by the running user (container runs as root)
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SUITE: ${{ (inputs.demo_failure && 'demo-failure') || github.event.inputs.suite || (github.event_name == 'schedule' && 'regression') || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('pom.xml') }}
      - name: Run ${{ env.SUITE }} on ${{ matrix.browser }}
        run: mvn -B test -Dsuite=${SUITE} -Dbrowser=${{ matrix.browser }} -Dheadless=true -Dretry.count=3   # the public demo site has long bad spells
      - name: Attach self-healing report to Allure
        # Every healed locator is a selector to fix in a page object. Surface them as one entry in the Allure report.
        if: always()
        run: |
          report=target/self-healing/heal-report.jsonl
          if [ ! -s "$report" ]; then echo "No locators healed"; exit 0; fi
          heals=$(wc -l < "$report")
          id=$(cat /proc/sys/kernel/random/uuid)
          now=$(date +%s%3N)
          mkdir -p target/allure-results
          cp "$report" "target/allure-results/${id}-attachment.txt"
          cat > "target/allure-results/${id}-result.json" <<EOF
          {"uuid":"${id}","historyId":"self-healing-${{ matrix.browser }}",
           "name":"Self-healing report (${{ matrix.browser }})","fullName":"selfheal.report.${{ matrix.browser }}",
           "status":"passed","stage":"finished","start":${now},"stop":${now},
           "description":"${heals} locator heal event(s). Update these selectors in the page objects.",
           "labels":[{"name":"feature","value":"Self-healing locators"}],
           "attachments":[{"name":"heal-report.jsonl","source":"${id}-attachment.txt","type":"text/plain"}]}
          EOF
      - name: Upload self-healing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-${{ matrix.browser }}
          path: target/self-healing/heal-report.jsonl
          if-no-files-found: ignore
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}
          path: target/traces
      - name: Upload test results for triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore

  triage:
    name: Failure triage (Claude)
    needs: e2e
    # Only when the gating E2E job failed. Firefox/WebKit legs are continue-on-error, so their failures alone
    # don't trigger this, but their results are included when it runs.
    if: failure() && needs.e2e.result == 'failure'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=Failure triage::ANTHROPIC_API_KEY secret is not set, skipping triage"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Download test results
        if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: triage-input/results
      - name: Download self-healing reports
        if: steps.key.outputs.present == 'true'
        continue-on-error: true   # absent when no locator was healed
        uses: actions/download-artifact@v4
        with:
          pattern: self-healing-*
          path: triage-input/heals
      - name: Classify failures with Claude
        if: steps.key.outputs.present == 'true'
        run: mvn -B -q -f ci/triage/pom.xml compile exec:java -Dexec.args="triage-input/results triage-input/heals triage"
      - name: Upload triage report
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: failure-triage
          path: triage
          if-no-files-found: ignore

  docker:
    name: Docker image + remote browser server
    needs: checks
    runs-on: ubuntu-latest
    env:
      RETRY_COUNT: "3"   # the public demo site has long bad spells
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose build tests
      - name: API suite inside the container
        run: SUITE=api docker compose run --rm tests
      - name: Smoke suite against the Playwright server container
        run: |
          SUITE=smoke docker compose --profile remote up \
            --abort-on-container-exit --exit-code-from tests-remote tests-remote
      - name: Tear down
        if: always()
        run: docker compose --profile remote down --remove-orphans

  report:
    name: Allure report
    needs: e2e
    if: always() && github.ref == 'refs/heads/main' && !inputs.demo_failure   # keep demo failures off the live report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - name: Download results from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate report
        run: |
          npm install -g allure-commandline@2.30.0
          allure generate allure-results --clean -o allure-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - name: Publish to GitHub Pages
        id: deploy
        continue-on-error: true   # the artifact listing can lag a few seconds behind the upload; retry once below
        uses: actions/deploy-pages@v4
      - name: Wait for the Pages artifact to be indexed
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Publish to GitHub Pages (retry)
        id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
